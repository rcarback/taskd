StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Microsoft, Google, write-good, proselint, Readability, https://github.com/tbhb/vale-ai-tells/releases/download/v1.21.2/ai-tells.zip

[*.{md,txt}]
BasedOnStyles = Vale, Microsoft, Google, write-good, proselint, ai-tells, Readability, Taskd

# Contractions stay banned. The Microsoft and Google rules require them, which
# is the opposite of this project's standard, so both stay off and the house
# rule in .vale/styles/Taskd enforces the ban.
Google.Contractions = NO
Microsoft.Contractions = NO

# Spelling needs a project dictionary that does not exist yet.
Vale.Spelling = NO

# House style on dashes and em dashes.
write-good.E-Prime = NO
Microsoft.Dashes = NO
Google.EmDash = NO
ai-tells.EmDashUsage = NO
ai-tells.MicDrop = NO
ai-tells.CataphoricForecasting = NO
ai-tells.ShipOveruse = NO

# Domain vocabulary. This project is about coding agents and command-line
# tools, so the following substitutions are wrong here:
#   Microsoft.Terms     wants "personal digital assistant" for "agent"
#   Google.WordList     wants "command-line tool" for "CLI"
#   Microsoft.Negative  reads the `kill -0` flag as a negative number
Microsoft.Terms = NO
Google.WordList = NO
Microsoft.Negative = NO

# Acronyms named in the design (MCP, TERM, KILL) are defined by context.
Microsoft.Acronyms = NO
Google.Acronyms = NO
